<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大通个人版对账单编辑器</title>
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.45 -apple-system,"PingFang SC",sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
  #form { width: 560px; overflow-y: auto; padding: 14px 16px 60px; border-right: 1px solid #dfe3e8; background: #fafbfc; }
  #preview { flex: 1; overflow: auto; background: #eef1f4; padding: 14px; text-align: center; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h3 { font-size: 12.5px; margin: 18px 0 6px; color: #b3123a; border-bottom: 1px solid #eee; padding-bottom: 3px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { padding: 7px 14px; border-radius: 8px; cursor: pointer; border: 1px solid #cfd6de; background: #fff; }
  .tab.on { background: #b3123a; color: #fff; border-color: #b3123a; font-weight: 600; }
  label { display: block; margin: 5px 0 1px; color: #444; }
  input[type=text], textarea { width: 100%; padding: 4px 7px; border: 1px solid #cfd6de; border-radius: 5px; font: inherit; }
  textarea { min-height: 44px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .hint { color: #8a94a0; font-size: 11.5px; margin: 2px 0 4px; }
  table { width: 100%; border-collapse: collapse; margin: 4px 0; }
  th { text-align: left; font-size: 11px; color: #666; padding: 2px 3px; }
  td { padding: 2px 2px; vertical-align: top; }
  td input { padding: 3px 5px; }
  .del { color: #c33; cursor: pointer; font-weight: 700; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #cfd6de; background: #fff; cursor: pointer; }
  button.primary { background: #b3123a; border-color: #b3123a; color: #fff; }
  .toolbar { position: sticky; top: -14px; background: #fafbfc; padding: 10px 0 8px; z-index: 5; border-bottom: 1px solid #e5e9ee; }
  .status { font-size: 11.5px; color: #678; margin-top: 4px; min-height: 15px; }
  img.page { max-width: 100%; margin: 8px auto; box-shadow: 0 1px 6px rgba(0,0,0,.18); background: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 5px; margin: 4px 10px 4px 0; }
</style>
</head>
<body>
<div id="form">
  <h1>大通对账单模板编辑器</h1>
  <div class="hint">大通（Chase）个人版 College Checking 独立编辑器（与商业版完全分离）；输出带 SAMPLE 水印；默认导出与原稿一致（无加密）。</div>
  <div class="toolbar">
    <span class="toggle"><input type="checkbox" id="wm" checked onchange="sched()"> SAMPLE 水印</span>
    <span class="toggle"><input type="checkbox" id="auto" checked onchange="sched()"> 自动计算</span>
    <span class="toggle"><input type="checkbox" id="enc" onchange="sched()"> 导出加密(禁改)</span>
    <button class="primary" onclick="downloadPdf()">下载 PDF</button>
    <button onclick="exportJson()">导出 JSON</button>
    <button onclick="resetAll()">恢复示例</button>
    <div class="status" id="status">加载中…</div>
  </div>

  <div id="fields"></div>
</div>
<div id="preview"></div>

<script>
let DATA = {personal: null};
let TPL = "personal";
let timer = null, seq = 0;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "oninput") e.addEventListener("input", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const lbl = (t) => el("label", null, t);
const h3 = (t) => el("h3", null, t);
const hint = (t) => el("div", {class: "hint"}, t);
function inp(path, val, ph) {
  return el("input", {type: "text", value: val ?? "", placeholder: ph || "", oninput: (ev) => { setPath(DATA[TPL], path, ev.target.value); sched(); }});
}
function setPath(o, path, v) {
  const ks = path.split(".");
  let c = o;
  for (let i = 0; i < ks.length - 1; i++) c = c[ks[i]];
  c[ks.at(-1)] = v;
}

const TX_TYPES = [["deposit", "存款"], ["atm", "ATM/借记卡"], ["electronic", "电子取款"], ["fee", "费用"]];

function moneyRows(secKey, cols, headers) {
  const d = DATA[TPL];
  d[secKey] = d[secKey] || [];
  const rows = d[secKey];
  const t = el("table", null);
  t.append(el("tr", null, ...headers.map(h => el("th", null, h)), el("th")));
  rows.forEach((r, i) => {
    const tr = el("tr", null);
    cols.forEach(([key]) => {
      tr.append(el("td", null, el("input", {type: "text", value: r[key] ?? "", oninput: (ev) => { r[key] = ev.target.value; sched(); }})));
    });
    if (cols.some(c => c[0] === "caret")) {
      tr.append(el("td", null, el("input", {type: "checkbox", ...(r.caret ? {checked: ""} : {}), onchange: (e) => { r.caret = e.target.checked ? "^" : ""; sched(); }, title: "^ 标记"})));
    }
    tr.append(el("td", {class: "del", onclick: () => { rows.splice(i, 1); render(); sched(); }}, "✕"));
    t.append(tr);
  });
  const wrap = el("div", null, t);
  wrap.append(el("button", {onclick: () => { rows.push(cols.reduce((o, [k]) => (o[k] = "", o), {})); render(); sched(); }}, "+ 添加一行"));
  return wrap;
}

function txRows() {
  const d = DATA[TPL];
  d.transactions = d.transactions || [];
  const rows = d.transactions;
  const t = el("table", null);
  t.append(el("tr", null,
    el("th", null, "日期"), el("th", null, "描述（可含换行）"), el("th", null, "金额"),
    el("th", null, "交易类型"), el("th")));
  rows.forEach((r, i) => {
    const tr = el("tr", null);
    const inp = (key, w) => el("td", null, el("input", {type: "text", value: r[key] ?? "",
      oninput: (ev) => { r[key] = ev.target.value; sched(); }}));
    tr.append(inp("date"), inp("desc"), inp("amount"));
    const sel = el("select", {onchange: (ev) => { r.type = ev.target.value; sched(); }});
    for (const [v, label] of TX_TYPES) {
      const o = el("option", {value: v}, label);
      if ((r.type || "deposit") === v) o.selected = true;
      sel.append(o);
    }
    tr.append(el("td", null, sel));
    tr.append(el("td", {class: "del", onclick: () => { rows.splice(i, 1); render(); sched(); }}, "✕"));
    t.append(tr);
  });
  const wrap = el("div", null, t);
  wrap.append(el("button", {onclick: () => {
    rows.push({date: "", desc: "", amount: "", type: "deposit"});
    render(); sched();
  }}, "+ 添加一笔"));
  return wrap;
}

function nowPdfDate() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `D:${d.getUTCFullYear()}${p(d.getUTCMonth() + 1)}${p(d.getUTCDate())}` +
         `${p(d.getUTCHours())}${p(d.getUTCMinutes())}${p(d.getUTCSeconds())}UTC00'00'`;
}
function render() {
  const d = DATA.personal;
  const biz = false;
  document.getElementById("wm").checked = !!d.watermark;
  document.getElementById("auto").checked = d.auto !== false;
  document.getElementById("enc").checked = !!d.encrypt;
  const F = document.getElementById("fields");
  F.textContent = "";

  F.append(h3("银行与抬头（替换原稿 Chase 名称）"));
  F.append(lbl("银行显示名"), inp("bank.name", d.bank?.name));
  const r1 = el("div", {class: "row"});
  r1.append(el("div", null, lbl("法定全称"), inp("bank.legal", d.bank?.legal)),
            el("div", null, lbl("域名（建议与 Chase.com 等长=9 字符，避免静态句叠印）"), inp("bank.domain", d.bank?.domain)));
  F.append(r1);
  const r1b = el("div", {class: "row"});
  r1b.append(el("div", null, lbl("账号显示（右上数字串）"), inp("account_display", d.account_display)));
  if (biz) {
    r1b.append(el("div", null, lbl("条码跟踪号（右侧竖条码）"), inp("barcode_num", d.barcode_num)));
  } else {
    // 个人版：条码号输入不实时渲染，点击“生成条码”才应用
    const wrap = el("div", null);
    const box = el("div", {style: "display:flex;gap:6px"});
    const i = el("input", {type: "text", value: d.barcode_input ?? d.barcode_num ?? "",
      placeholder: "输入条码号后点击生成", oninput: (e) => { DATA[TPL].barcode_input = e.target.value; }});
    const btn = el("button", {onclick: () => {
      DATA[TPL].barcode_num = (DATA[TPL].barcode_input || "").trim();
      render(); sched();
    }}, "生成条码");
    box.append(i, btn);
    wrap.append(lbl("条码号（输入后点“生成条码”）"), box,
      hint("当前已生成: " + (d.barcode_num || "（原稿条码）")));
    r1b.append(wrap);
  }
  F.append(r1b);

  F.append(h3("客户与账单"));
  F.append(lbl(biz ? "客户行（每行一条；第 4 行=邮编）" : "客户行（每行一条，最多 3 行）"),
    el("textarea", {oninput: (e) => { d.customer_lines = e.target.value.split("\n"); sched(); }}, (d.customer_lines || []).join("\n")));
  const r2 = el("div", {class: "row"});
  r2.append(el("div", null, lbl("邮编（行末列）"), inp("zip", d.zip)),
            el("div", null, lbl("期初余额"), inp("begin_balance", d.begin_balance)));
  F.append(r2);
  F.append(lbl("期间标签"), inp("period.label", d.period?.label));

  F.append(h3("MICR 编码行（客户信息上方）"));
  const rm = el("div", {class: "row"});
  rm.append(el("div", null, lbl("路由号"), inp("micr.routing", d.micr?.routing)),
            el("div", null, lbl("DRE 段"), inp("micr.dre", d.micr?.dre)));
  F.append(rm);
  const rm2 = el("div", {class: "row"});
  rm2.append(el("div", null, lbl("周期段"), inp("micr.cycle", d.micr?.cycle)),
             el("div", null, lbl("尾部段"), inp("micr.extra", d.micr?.extra)));
  F.append(rm2);

  if (biz) {
    F.append(h3("存款与其他入账"));
    F.append(moneyRows("deposits", [["date"], ["desc"], ["amount"]], ["日期", "描述（可含换行）", "金额"]));
    F.append(h3("兑付支票"));
    F.append(moneyRows("checks", [["no"], ["desc"], ["paid"], ["amount"], ["caret"]], ["支票号", "描述", "兑付日", "金额", "^"]));
    F.append(h3("电子取款"));
    F.append(moneyRows("electronic_withdrawals", [["date"], ["desc"], ["amount"]], ["日期", "描述（可含换行）", "金额"]));
    F.append(h3("其他取款"));
    F.append(moneyRows("other_withdrawals", [["date"], ["desc"], ["amount"]], ["日期", "描述（可含换行）", "金额"]));
    F.append(h3("费用"));
    F.append(moneyRows("fees", [["date"], ["desc"], ["amount"]], ["日期", "描述", "金额"]));
    F.append(hint("摘要/各段合计/笔数/每日期末余额自动计算（勾选“自动计算”）。金额填正数即可。"));
  } else {
    F.append(h3("交易流水（按日期排序，同日保持录入顺序）"));
    F.append(txRows());
    F.append(hint("流水按日期自动排序（同日保持录入顺序，编辑器与模板始终一致）；每笔选择交易类型（用于摘要分类）；存款自动加粗（F10 粗体）；余额自动累计；摘要自动计算。两页容量约 38 笔单行流水，超出部分不会显示。"));
  }

  F.append(h3("元数据（留空=默认值）"));
  d.metadata = d.metadata || {};
  const md = d.metadata;
  F.append(lbl("PDF 作者"), inp("metadata.author", md.author));
  F.append(lbl("PDF 生成器"), inp("metadata.producer", md.producer),
    hint("留空=默认 OpenText Output Transformation Engine - 23.4.26"));
  F.append(lbl("创建软件"), inp("metadata.creator", md.creator));
  // 时间字段 + 「写入现在」：留空=生成时实时时间（修改时间留空=同创建时间）
  const dtRow = (path, val) => {
    const box = el("div", {style: "display:flex;gap:6px"});
    const i = el("input", {type: "text", value: val ?? "", placeholder: "D:YYYYMMDDHHMMSSUTC00'00'",
      oninput: (ev) => { setPath(DATA[TPL], path, ev.target.value); sched(); }});
    const b = el("button", {onclick: () => {
      i.value = nowPdfDate();
      i.dispatchEvent(new Event("input", {bubbles: true}));
    }}, "写入现在");
    box.append(i, b);
    return box;
  };
  F.append(lbl("创建时间（留空=生成时实时时间）"), dtRow("metadata.creation", md.creation));
  F.append(lbl("修改时间（留空=同创建时间）"), dtRow("metadata.mod", md.mod));
  F.append(hint("导出默认不加密（与原稿一致）；勾选“导出加密”则 AES-256 仅允许打印。"));
}


let pagesCache = {};
// 流水顺序权威化：归一化日期排序（与服务端 date_key 一致；稳定排序保持同日录入顺序）
function dateKey(s) {
  const p = String(s || "").match(/\d+/g) || [];
  if (!p.length) return "";
  const m = +p[0], d = p.length > 1 ? +p[1] : 0, y = p.length > 2 ? +p[2] : 0;
  return String(y).padStart(4, "0") + String(m).padStart(2, "0") + String(d).padStart(2, "0");
}
function sortTx() {
  const t = DATA[TPL] && DATA[TPL].transactions;
  if (Array.isArray(t)) t.sort((a, b) => { const ka = dateKey(a.date), kb = dateKey(b.date); return ka < kb ? -1 : ka > kb ? 1 : 0; });
}
function sched() {
  clearTimeout(timer);
  document.getElementById("status").textContent = "修改中…";
  timer = setTimeout(runGen, 450);
}
async function runGen() {
  // 文本输入中不刷新（输完 150 才算一次输入）；勾选框/按钮不属"输入中"
  const ae = document.activeElement;
  if (ae && ((ae.tagName === "INPUT" && ae.type === "text") || ae.tagName === "TEXTAREA")
      && document.getElementById("form").contains(ae)) {
    timer = setTimeout(runGen, 500);
    return;
  }
  const d = JSON.parse(JSON.stringify(DATA[TPL]));
  d.watermark = document.getElementById("wm").checked;
  d.auto = document.getElementById("auto").checked;
  d.encrypt = document.getElementById("enc").checked;
  const my = ++seq;
  try {
    const res = await fetch("/api/generate", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({template: TPL, data: d, watermark: d.watermark})});
    const j = await res.json();
    if (my !== seq) return;
    if (!j.ok) { document.getElementById("status").textContent = "❌ " + (j.error || "生成失败"); return; }
    pagesCache[TPL] = j.hashes || j.pages;
    // 不重建表单（保住输入焦点）；行序不在打字中途跳变，只更新预览
    renderPreviewStatic(j.hashes);
    document.getElementById("status").textContent = "已更新 " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("status").textContent = "❌ " + e.message;
  }
}
// 焦点离开任一文本输入 → 立即按完整值刷新
document.getElementById("form").addEventListener("focusout", () => sched());

function renderPreviewStatic(hashes) {
  // 页级内容哈希寻址 + img 复用：只重载真正变化的页，不重建不闪烁
  const P = document.getElementById("preview");
  const list = hashes || pagesCache[TPL] || 2;
  const n = typeof list === "number" ? list : list.length;
  let imgs = [...P.querySelectorAll("img.page")];
  while (imgs.length < n) {
    const img = el("img", {class: "page", loading: "eager"});
    img.onerror = () => { img.classList.add("retry"); setTimeout(() => { img.src = img.src.replace(/\/pv\/[^/]+\//, `/pv/${Date.now()}/`); }, 800); };
    P.append(img);
    imgs.push(img);
  }
  while (imgs.length > n) imgs.pop().remove();
  for (let i = 0; i < n; i++) {
    const key = typeof list === "number" ? Date.now() : list[i];
    const src = `/pv/${key}/p${i + 1}.png`;
    if (!imgs[i].src.endsWith(src)) imgs[i].src = src;
  }
}

function downloadPdf() {
  location.href = "/export/statement.pdf?tpl=" + TPL
    + "&wm=" + (document.getElementById("wm").checked ? 1 : 0)
    + "&enc=" + (document.getElementById("enc").checked ? 1 : 0);
}
function exportJson() { location.href = "/export/data.json?tpl=" + TPL; }
async function resetAll() {
  if (!confirm("恢复示例数据？")) return;
  await fetch("/api/reset");
  await init();
}

async function init() {
  const res = await fetch("/api/data");
  const j = await res.json();
  DATA = {personal: j.personal};
  document.getElementById("wm").checked = j.watermark;
  sortTx();
  render();
  sched();
}
init();
</script>
</body>
</html>
