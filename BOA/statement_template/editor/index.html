<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BOA 对账单模板编辑器</title>
<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.45 -apple-system,"PingFang SC",sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
  #form { width: 560px; overflow-y: auto; padding: 14px 16px 60px; border-right: 1px solid #dfe3e8; background: #fafbfc; }
  #preview { flex: 1; overflow: auto; background: #eef1f4; padding: 14px; text-align: center; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h3 { font-size: 12.5px; margin: 18px 0 6px; color: #b3123a; border-bottom: 1px solid #eee; padding-bottom: 3px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { padding: 7px 14px; border-radius: 8px; cursor: pointer; border: 1px solid #cfd6de; background: #fff; }
  .tab.on { background: #b3123a; color: #fff; border-color: #b3123a; font-weight: 600; }
  label { display: block; margin: 5px 0 1px; color: #444; }
  input[type=text], textarea { width: 100%; padding: 4px 7px; border: 1px solid #cfd6de; border-radius: 5px; font: inherit; }
  textarea { min-height: 44px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .hint { color: #8a94a0; font-size: 11.5px; margin: 2px 0 4px; }
  table { width: 100%; border-collapse: collapse; margin: 4px 0; }
  th { text-align: left; font-size: 11px; color: #666; padding: 2px 3px; }
  td { padding: 2px 2px; vertical-align: top; }
  td input { padding: 3px 5px; }
  .del { color: #c33; cursor: pointer; font-weight: 700; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #cfd6de; background: #fff; cursor: pointer; }
  button.primary { background: #b3123a; border-color: #b3123a; color: #fff; }
  .toolbar { position: sticky; top: -14px; background: #fafbfc; padding: 10px 0 8px; z-index: 5; border-bottom: 1px solid #e5e9ee; }
  .status { font-size: 11.5px; color: #678; margin-top: 4px; min-height: 15px; }
  img.page { max-width: 100%; margin: 8px auto; box-shadow: 0 1px 6px rgba(0,0,0,.18); background: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 5px; margin: 4px 10px 4px 0; }
  img.retry { opacity: .4; }
</style>
</head>
<body>
<div id="form">
  <h1>BOA 对账单模板编辑器</h1>
  <div class="hint">个人版（Adv Plus Banking）与商业版（Business Advantage）双模板；输出带 SAMPLE 水印；银行名替换为 Sample Bank。</div>
  <div class="toolbar">
    <div class="tabs">
      <div class="tab on" data-tpl="personal" onclick="switchTpl('personal')">个人版 Personal</div>
      <div class="tab" data-tpl="business" onclick="switchTpl('business')">商业版 Business</div>
    </div>
    <span class="toggle"><input type="checkbox" id="wm" checked onchange="sched()"> SAMPLE 水印</span>
    <span class="toggle"><input type="checkbox" id="auto" checked onchange="sched()"> 自动计算</span>
    <span class="toggle"><input type="checkbox" id="showDaily" checked onchange="sched()"> 每日余额(商业)</span>
    <button class="primary" onclick="downloadPdf()">下载 PDF</button>
    <button onclick="exportJson()">导出 JSON</button>
    <button onclick="resetAll()">恢复示例</button>
    <div class="status" id="status">加载中…</div>
  </div>

  <div id="fields"></div>
</div>
<div id="preview"></div>

<script>
let DATA = {personal: null, business: null};
let TPL = "personal";
let timer = null, seq = 0;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "oninput") e.addEventListener("input", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const lbl = (t) => el("label", null, t);
const h3 = (t) => el("h3", null, t);
const hint = (t) => el("div", {class: "hint"}, t);
function inp(path, val, ph) {
  const i = el("input", {type: "text", value: val ?? "", placeholder: ph || "", oninput: () => { setPath(DATA[TPL], path, i.value); sched(); }});
  return i;
}
function setPath(o, path, v) {
  const ks = path.split(".");
  let c = o;
  for (let i = 0; i < ks.length - 1; i++) c = c[ks[i]];
  c[ks.at(-1)] = v;
}
function getPath(o, path) { return path.split(".").reduce((a, k) => a?.[k], o); }

function moneyRows(secKey, cols, headers) {
  const d = DATA[TPL];
  const rows = d[secKey] || [];
  const t = el("table", null);
  t.append(el("tr", null, ...headers.map(h => el("th", null, h)), el("th")));
  rows.forEach((r, i) => {
    const tr = el("tr", null);
    cols.forEach(([key, w]) => {
      tr.append(el("td", null, el("input", {type: "text", value: r[key] ?? "", oninput: (ev) => { r[key] = ev.target.value; sched(); }})));
    });
    tr.append(el("td", {class: "del", onclick: () => { rows.splice(i, 1); render(); sched(); }}, "✕"));
    t.append(tr);
  });
  const wrap = el("div", null, t);
  wrap.append(el("button", {onclick: () => { rows.push(cols.reduce((o, [k]) => (o[k] = "", o), {})); render(); sched(); }}, "+ 添加一行"));
  return wrap;
}

function render() {
  const d = DATA[TPL];
  const biz = TPL === "business";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tpl === TPL));
  document.getElementById("wm").checked = !!d.watermark;
  document.getElementById("auto").checked = !!d.auto;
  document.getElementById("showDaily").checked = d.show_daily !== false;
  document.getElementById("showDaily").parentElement.style.display = biz ? "" : "none";
  const F = document.getElementById("fields");
  F.textContent = "";

  F.append(lbl("银行显示名"), inp("bank.name", d.bank?.name));
  const r1 = el("div", {class: "row"});
  const c1 = el("div", null, lbl("法定全称"), inp("bank.legal", d.bank?.legal));
  const c2 = el("div", null, lbl("域名"), inp("bank.domain", d.bank?.domain));
  r1.append(c1, c2); F.append(r1);

  F.append(h3("客户与账户"));
  F.append(lbl("客户行（每行一条，最多 4 行）"),
    el("textarea", {oninput: (e) => { d.customer_lines = e.target.value.split("\\n"); sched(); }}, (d.customer_lines || []).join("\\n")));
  F.append(lbl("后续页页眉客户名（横向展开，多名字空格分隔）"), inp("strip_name", d.strip_name));
  F.append(lbl(biz ? "所有者行（页1粗体行）" : "账户持有人行（多名字用空格分隔）"), inp("owner_line", d.owner_line));
  const r2 = el("div", {class: "row"});
  r2.append(el("div", null, lbl("账号（空格分隔）"), inp("account_number", d.account_number)),
            el("div", null, lbl("产品名"), inp("product", d.product)));
  F.append(r2);

  F.append(h3("账单期间"));
  F.append(lbl("期间标签"), inp("period.label", d.period?.label));
  const r3 = el("div", {class: "row"});
  r3.append(el("div", null, lbl("开始日期"), inp("period.begin", d.period?.begin)),
            el("div", null, lbl("结束日期"), inp("period.end", d.period?.end)));
  F.append(r3);
  F.append(lbl("期初余额"), inp("begin_balance", d.begin_balance));
  F.append(hint("自动计算：逐段合计、期末余额、每日余额、商业统计行中的笔数。"));

  F.append(h3("存款流水"));
  F.append(moneyRows("deposits", [["date", "70px"], ["desc", "auto"], ["amount", "80px"]], ["日期", "描述（可含换行）", "金额"]));
  F.append(h3("取款流水"));
  F.append(moneyRows("withdrawals", [["date", "70px"], ["desc", "auto"], ["amount", "80px"]], ["日期", "描述（可含换行）", "金额"]));
  F.append(h3("月费"));
  F.append(moneyRows("fees", [["date", "70px"], ["desc", "auto"], ["amount", "80px"]], ["日期", "描述", "金额"]));
  F.append(hint("支票支出汇总固定为 -0.00（按需求不支持支票数据）。"));

  if (biz) {
    F.append(h3("月费资格（勾=已达标）"));
    const qs = d.qualifications || [];
    qs.forEach((q, i) => {
      const row = el("div", {class: "row"});
      row.append(
        el("div", {style: "flex:0 0 40px"}, el("input", {type: "checkbox", ...(q.met ? {checked: ""} : {}), onchange: (e) => { q.met = e.target.checked; sched(); }})),
        el("div", null, el("input", {type: "text", value: q.text || "", oninput: (e) => { q.text = e.target.value; sched(); }})));
      F.append(row);
    });
    F.append(h3("统计（# of 行）"));
    const r4 = el("div", {class: "row"});
    r4.append(el("div", null, lbl("上期项目数"), inp("stats.items_prev", d.stats?.items_prev)),
              el("div", null, lbl("周期天数"), inp("stats.days", d.stats?.days)),
              el("div", null, lbl("平均账面余额"), inp("stats.avg_ledger", d.stats?.avg_ledger)));
    F.append(r4);
    F.append(hint("存款/取款笔数与统计自动计算。"));
  }

  F.append(h3("页面与元数据"));
  F.append(lbl("最少页数"), inp("min_pages", d.min_pages));
  const md = d.metadata || {};
  F.append(lbl("PDF 作者"), inp("metadata.author", md.author));
  F.append(lbl("PDF 生成器"), inp("metadata.producer", md.producer));
  F.append(lbl("创建软件"), inp("metadata.creator", md.creator));
  F.append(lbl("创建时间（PDF D: 格式，留空不写）"), inp("metadata.creation", md.creation));
}

function switchTpl(t) { TPL = t; render(); renderPreviewStatic(); sched(); }

function fmtMoney(neg, cents, dollar) {
  const s = Math.abs(cents);
  const t = Math.floor(s / 100).toLocaleString("en-US") + "." + String(s % 100).padStart(2, "0");
  return (neg || cents < 0 ? "-" : "") + (dollar ? "$" : "") + t;
}
function toCents(v) {
  const m = String(v ?? "").replace(/[$,]/g, "").trim();
  if (!m) return 0;
  const f = parseFloat(m);
  return isNaN(f) ? 0 : Math.round(f * 100);
}
function applyAuto(d) {
  if (!d.auto) return;
  const begin = toCents(d.begin_balance);
  const dep = (d.deposits || []).reduce((a, r) => a + toCents(r.amount), 0);
  const wd = (d.withdrawals || []).reduce((a, r) => a + toCents(r.amount), 0);
  const fee = (d.fees || []).reduce((a, r) => a + toCents(r.amount), 0);
  d.summary = {
    begin: fmtMoney(false, begin, true), deposits: fmtMoney(false, dep),
    withdrawals: fmtMoney(false, wd), checks: "-0.00", fees: fmtMoney(false, fee),
    ending: fmtMoney(false, begin + dep + wd + fee, true),
  };
  d.totals = { deposits: fmtMoney(false, dep, true), withdrawals: fmtMoney(false, wd, true),
               checks: "-$0.00", fees: fmtMoney(false, fee, true) };
}

let pagesCache = {};
function sched() {
  clearTimeout(timer);
  document.getElementById("status").textContent = "修改中…";
  timer = setTimeout(async () => {
    // 焦点保持：文本输入进行中不触发生成/预览（输完整个值才算一次输入）；
    // 勾选框/下拉/按钮即时生效，不属"输入中"。失焦由 focusout 监听立即触发
    const ae = document.activeElement;
    if (ae && ((ae.tagName === "INPUT" && (ae.type === "text" || !ae.type || ae.type === "number"))
        || ae.tagName === "TEXTAREA") && document.getElementById("form").contains(ae)) {
      timer = setTimeout(sched, 500);
      return;
    }
    const d = JSON.parse(JSON.stringify(DATA[TPL]));
    d.watermark = document.getElementById("wm").checked;
    d.auto = document.getElementById("auto").checked;
    applyAuto(d);
    const my = ++seq;
    try {
      const res = await fetch("/api/generate", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({template: TPL, data: d, watermark: d.watermark})});
      const j = await res.json();
      if (my !== seq) return;
      if (!j.ok) { document.getElementById("status").textContent = "❌ " + (j.error || "生成失败"); return; }
      pagesCache[TPL] = j.pages;
      renderPreviewStatic(j.pages);
      document.getElementById("status").textContent = "已更新 " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("status").textContent = "❌ " + e.message;
    }
  }, 450);
}

// 焦点离开任一文本输入 → 立即按完整值刷新
document.getElementById("form").addEventListener("focusout", () => sched());

function renderPreviewStatic(n) {
  const P = document.getElementById("preview");
  P.textContent = "";
  const pages = n || pagesCache[TPL] || 8;
  const v = Date.now();
  for (let i = 1; i <= pages; i++) {
    const img = el("img", {class: "page", loading: "eager"});
    img.onerror = () => { img.classList.add("retry"); setTimeout(() => { img.classList.remove("retry"); img.src = img.src.replace(/\/pv\/\d+\//, `/pv/${Date.now()}/`); }, 800); };
    // 内嵌浏览器对 ?查询串 的 localhost 图片会失败 → 用路径版本号穿透缓存
    img.src = `/pv/${v}/${TPL}_p${i}.png`;
    P.append(img);
  }
}

function downloadPdf() { location.href = "/export/statement.pdf?tpl=" + TPL; }
function exportJson() { location.href = "/export/data.json"; }
async function resetAll() {
  if (!confirm("恢复两个模板的示例数据？")) return;
  await fetch("/api/reset");
  await init();
}

async function init() {
  const res = await fetch("/api/data");
  const j = await res.json();
  DATA = {personal: j.personal, business: j.business};
  document.getElementById("wm").checked = j.watermark;
  render();
  sched();
}
init();
</script>
</body>
</html>
