<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对账单模板 · 可视化编辑器</title>
<style>
/* ============================================================
   字体声明 —— 与原稿一致：
   · 嵌入式 TrueType 四款（ArialMT / Arial-BoldMT /
     TimesNewRomanPSMT / SymbolMT），对应原稿 PDF 的内嵌字体
   · Helvetica / Helvetica-Bold / Times-Roman 为原稿按名引用的
     base-14 字体（原稿未嵌入）；此处 local() 优先，随附同
     metric 字体兜底，保证跨平台渲染一致
   ============================================================ */
@font-face { font-family:"ArialMT";           src:url("fonts/ArialMT.ttf") format("truetype"); }
@font-face { font-family:"Arial-BoldMT";      src:url("fonts/Arial-BoldMT.ttf") format("truetype"); }
@font-face { font-family:"TimesNewRomanPSMT"; src:url("fonts/TimesNewRomanPSMT.ttf") format("truetype"); }
@font-face { font-family:"SymbolMT";          src:url("fonts/SymbolMT.ttf") format("truetype"); }
@font-face { font-family:"Helvetica"; font-weight:400;
  src:url("fonts/Helvetica.ttf") format("truetype"), local("Helvetica"); }
@font-face { font-family:"Helvetica"; font-weight:700;
  src:url("fonts/Helvetica-Bold.ttf") format("truetype"), local("Helvetica-Bold"), local("Helvetica Bold"); }
@font-face { font-family:"Times-Roman"; font-weight:400;
  src:url("fonts/Times-Roman.ttf") format("truetype"), local("Times-Roman"), local("Times"); }

* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }
body { font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#3b3f45; color:#222; }
#app { display:flex; flex-direction:column; height:100%; }
#toolbar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:#23262b; color:#eee;
  flex:none; flex-wrap:wrap; }
#toolbar h1 { font-size:14px; margin:0 12px 0 0; font-weight:600; white-space:nowrap; }
#toolbar button, #toolbar select { background:#3a3f47; color:#eee; border:1px solid #555b64; border-radius:6px;
  padding:5px 12px; font-size:12.5px; cursor:pointer; }
#toolbar button:hover { background:#4a505a; }
#toolbar button.primary { background:#2563eb; border-color:#2563eb; }
#toolbar button.primary:hover { background:#1d4fd7; }
#toolbar label { font-size:12.5px; display:flex; align-items:center; gap:4px; color:#ccc; cursor:pointer; }
#body { display:flex; flex:1; min-height:0; }

#panel { width:400px; flex:none; background:#f4f5f7; border-right:1px solid #23262b; overflow-y:auto;
  padding:12px 12px 60px; }
#panel fieldset { border:1px solid #d8dade; border-radius:8px; margin:0 0 12px; padding:8px 10px 10px; background:#fff; }
#panel legend { font-weight:600; font-size:12.5px; padding:0 6px; color:#333; }
.frow { display:flex; align-items:center; gap:6px; margin:4px 0; }
.frow > label { flex:none; width:98px; font-size:12px; color:#555; }
.frow input[type=text], .frow input[type=number], .frow select, .frow textarea {
  flex:1; min-width:0; font:12px/1.4 ui-monospace,Menlo,monospace; padding:3px 6px;
  border:1px solid #c9ccd2; border-radius:4px; background:#fff; }
.frow textarea { resize:vertical; }
.frow input:focus, .frow textarea:focus, .frow select:focus { outline:2px solid #9cc0ff; border-color:#2563eb; }
.hint { font-size:11px; color:#888; margin:2px 0 6px; }
.acct-card { border:1px solid #c9ccd2; border-radius:8px; margin:8px 0; background:#fbfbfc; }
.acct-card > .acct-head { display:flex; align-items:center; gap:6px; padding:6px 8px; background:#eceef1;
  border-radius:8px 8px 0 0; }
.acct-card > .acct-head b { flex:1; font-size:12.5px; }
.acct-card > .acct-body { padding:6px 8px 8px; }
.txn { border:1px solid #d5d8dd; border-radius:6px; padding:6px 8px; margin:6px 0; background:#fff; }
.txn .txn-tools { display:flex; gap:4px; margin-bottom:4px; align-items:center; }
.txn .txn-tools span { flex:1; font-size:11px; color:#999; }
.txn .txn-tools button, .acct-head button { font-size:11px; padding:2px 7px; border:1px solid #c2c6cc;
  background:#f0f1f4; border-radius:4px; cursor:pointer; color:#333; }
.txn .txn-tools button:hover, .acct-head button:hover { background:#e2e4e9; }
.txn .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 8px; }
.txn .grid2 > * { min-width:0; }
.txn .grid2 .frow { flex-direction:column; align-items:stretch; gap:1px; margin:3px 0; }
.txn .grid2 .frow > label { width:auto; font-size:11px; color:#777; }
#panel fieldset, .acct-card, .txn, .frow { min-width:0; }
.frow > label { overflow-wrap:break-word; }
.computed { font-size:11.5px; color:#0a7d32; background:#eefaf0; border:1px dashed #bfe6c8; border-radius:6px;
  padding:4px 8px; margin:6px 0; }
button.add { width:100%; padding:5px; margin:4px 0; border:1px dashed #9aa0a8; background:#fff; border-radius:6px;
  cursor:pointer; color:#444; }
button.add:hover { background:#f0f4ff; border-color:#2563eb; color:#2563eb; }

#preview { flex:1; overflow:auto; background:#565a61; position:relative; }
#pdfFrame { width:100%; height:100%; border:0; display:none; background:#565a61; }
body.pdfmode #pdfFrame { display:block; }
body.pdfmode #pages { display:none; }
#pages { padding:24px 0 60px; display:flex; flex-direction:column; align-items:center; gap:26px; }
.scale-wrap { transform-origin:top center; }
.page { width:612pt; height:792pt; position:relative; background:#fff; overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.45); }
.page span, .page i { position:absolute; white-space:pre; line-height:normal; transform-origin:0 0;
  font-kerning:none; font-feature-settings:"kern" 0, "liga" 0, "clig" 0, "hlig" 0; }
.page .boxline, .page .fillbox { position:absolute; }
.page svg.vec { position:absolute; left:0; top:0; width:612pt; height:792pt; display:block; pointer-events:none; }
.page .pj { position:absolute; white-space:pre; line-height:normal; text-align:justify; text-align-last:justify; }
.wm { position:absolute; inset:0; pointer-events:none; z-index:9; overflow:hidden; }
.wm span { position:absolute; font-family:Helvetica; font-weight:700; font-size:34pt; letter-spacing:10pt;
  color:rgba(0,0,0,.075); transform:rotate(-32deg); white-space:nowrap; }

@media print {
  @page { size:612pt 792pt; margin:0; }
  body { background:#fff; height:auto; }
  #app { display:block; height:auto; }
  #toolbar, #panel { display:none !important; }
  #preview { overflow:visible !important; background:#fff; position:static; }
  #pages { padding:0; gap:0; display:block; }
  .scale-wrap { zoom:1 !important; transform:none !important; }
  .page { box-shadow:none; margin:0; page-break-after:always; }
  .page:last-child { page-break-after:auto; }
}
</style>

<div id="app">
  <div id="toolbar">
    <h1>对账单模板编辑器</h1>
    <button id="btnExportPdf" class="primary">导出 PDF（代码直出）</button>
    <label>文件名
      <input type="text" id="pdfNameInput" style="width:110px;padding:4px 6px;border:1px solid #555b64;border-radius:6px;background:#3a3f47;color:#eee;font-size:12.5px" title="导出的 PDF 文件名（自动加 .pdf 后缀）">
    </label>
    <button id="btnOpenPdf">在新标签打开 PDF</button>
    <button id="btnPrint">浏览器打印(备用)</button>
    <button id="btnExportHTML">导出独立 HTML</button>
    <button id="btnExportJSON">导出数据 JSON</button>
    <button id="btnImportJSON">导入数据 JSON</button>
    <button id="btnReset">恢复默认数据</button>
    <label><input type="checkbox" id="chkWM" checked> SAMPLE 水印</label>
    <label><input type="checkbox" id="chkPdfPreview"> PDF 真实预览(可选)</label>
    <label>缩放

        <option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
      </select>
    </label>
    <span id="pdfStatus" style="font-size:12px;color:#9aa0a8"></span>
    <span id="pageCount" style="margin-left:auto;font-size:12px;color:#9aa0a8"></span>
    <input type="file" id="fileImport" accept=".json" style="display:none">
  </div>
  <div id="body">
    <aside id="panel"></aside>
    <main id="preview"><iframe id="pdfFrame" title="PDF 预览"></iframe><div id="pages"><div class="scale-wrap"></div></div></main>
  </div>
</div>

/* ---------- 账户页：规划（纯计算，渲染与估页共用） ---------- */
function planAccount(d, a){
  var A = C.acct, st = acctStats(a);
  var sumRows = 3 + (a.type==="spending" ? 1 : 0) + 1;
  var lastSumBase = A.sumRowBase0 + (sumRows-1)*A.sumRowStep;
  var sumEndBase = lastSumBase + A.sumEndGap;
  var sumBottom = sumEndBase + A.sumBottomGap;
  var odTop = sumBottom + A.odGap;
  var odBottom = odTop + A.odHeight;
  var actTop = odBottom + A.actGap;

  var rows = [];
  rows.push({kind:"begin", date:a.beginDate, label:"Beginning Balance", lines:1, bal:money(st.begin)});
  (a.txns||[]).forEach(function(t){
    var lines = [String(t.title||"")];
    String(t.detail||"").split("\n").forEach(function(x){
      if (x.trim()!=="") wrap(x, F.H, 10, A.descWrap).forEach(function(w){ lines.push(w); });
    });
    rows.push({kind:"tx", date:t.date, lines:lines, n:lines.length,
      credit:moneyPos(t.credit), debit:moneyNeg(t.debit), bal:money(t._bal)});
  });
  rows.push({kind:"end", date:d.meta.statementDate, label:"Ending Balance", lines:1, bal:money(st.end)});

  var pages = [], cur = [], top = actTop;
  rows.forEach(function(r, i){
    var nb;
    if (i === 0) nb = actTop + A.actBeginBase;
    else {
      var prev = rows[i-1];
      var prevExtra = prev.kind==="tx" ? (prev.n-1)*A.descStep : 0;
      var gap = r.kind==="end" ? A.endGap : (prev.kind==="begin" ? A.firstTxDelta : A.txGap);
      nb = cur.length ? cur[cur.length-1].base + prevExtra + gap : A.contActTop + A.actBeginBase;
    }
    var extra = r.kind==="tx" ? (r.n-1)*A.descStep : 0;
    if (cur.length && nb + extra + A.actBottomGap > A.pageBottomLimit){
      var lastPlaced = cur[cur.length-1], lp = lastPlaced.row;
      pages.push({top:top, rows:cur, bottom:lastPlaced.base + (lp.kind==="tx"?(lp.n-1)*A.descStep:0) + A.actBottomGap});
      cur = []; top = A.contActTop; nb = top + A.actBeginBase;
    }
    cur.push({row:r, base:nb});
  });
  if (cur.length){
    var lp2 = cur[cur.length-1].row;
    pages.push({top:top, rows:cur,
      bottom:cur[cur.length-1].base + (lp2.kind==="tx"?(lp2.n-1)*A.descStep:0) + A.actBottomGap});
  }
  return { pages:pages, sumBottom:sumBottom, odBottom:odBottom, actTop:actTop };
}

/* ---------- 披露页 ---------- */
  /* p4 全部文本已静态化（P4_STATIC），动态渲染已禁用 */
function page4(buf, d){
  var P = C.p4;
  headerFooter(buf, d, d._pageNo, d._total, false, false);
  /* 静态区域：原稿精确坐标直接复刻（不可编辑，含两端对齐逐字位置） */
  (P4_STATIC || []).forEach(function(sw){

    buf.push(rawSpan(sw.x, sw.b - ascOf(fs, sw.z), sw.t, fs, sw.z, ""));

  buf.push(T(P.corrLblX, P.corrLblBase, "Send Correspondence to: ", F.AB, 9));

  buf.push(T(55.56, P.corrBases[1], d.bank.corrAddr1b != null ? d.bank.corrAddr1b : "Box 951 ", F.A, 9));

  buf.push(T(P.depX3, P.depBases[2], d.bank.depAddr2, F.A, 9));
  var insLines = wrap(d.disclosures.instructions, F.A, 9, P.instrWrap);
  insLines.forEach(function(ln,i){
    buf.push(PJ(P.instrX, P.instrBase + i*P.instrLeading, ln, F.A, 9, i === insLines.length-1, 0.012));

  var L = P.wsLeftBox, R = P.wsRightBox;

  OPS.push({k:'i', x:L[0], y:L[1], w:L[2]-L[0], h:L[3]-L[1], src:'borderL'});
  buf.push('<div class="fillbox" style="left:'+R[0]+'pt;top:'+R[1]+'pt;width:'+(R[2]-R[0])+'pt;height:'+(R[3]-R[1])+'pt;background:url('+P4_BORDER_R+') 0 0/100% 100% no-repeat"></div>');
  OPS.push({k:'i', x:R[0], y:R[1], w:R[2]-R[0], h:R[3]-R[1], src:'borderR'});
  P.whiteCells.forEach(function(g){ buf.push(FILL(g[0],g[1],g[2],g[3], "#fff")); });
  P.grayPanels.forEach(function(g){
    buf.push(FILL(g[0],g[1],g[2],g[3], "#fff"));

/* ---------- 总渲染（两遍：先定页数/微影行，再渲染） ---------- */
function computeMicro(d, total){
  var m = d.meta, arr = [];
  for (var i=1;i<=total;i++){
    var tail = i===1 ? m.microTailFirst : (i===total ? m.microTailLast : m.microTailMid);
    arr.push(m.microfilmBase + (Number(m.seqStart)+i-1) + " 000 " + ("0"+i).slice(-2) + tail);
  }
  return arr;
}
function renderPages(d){
  VECSTORE = []; OPSSTORE = []; PAGEI = 0;
  var plans = d.accounts.map(function(a){ return planAccount(d, a); });
  var extraPages = plans.reduce(function(n,p){ return n + p.pages.length - 1; }, 0);
  d._total = 1 + d.accounts.length + extraPages + 1;
  d._micro = computeMicro(d, d._total);
  d._microP1Top = d._micro[0].replace(/\s*STMTCMB100\s*$/,"");
  d._titleTracked = !!TRK[trkKey(F.HB, 11, d.meta.title)];
  d._p1TitleTracked = !!TRK[trkKey(F.HB, 12, d.meta.page1Title)];

  var buf = [];
  buf.push(openPage());
  page1(buf, d);
  buf.push(closePage());

  d._pageNo = 2;
  d.accounts.forEach(function(a, ai){
    var plan = plans[ai];
    plan.pages.forEach(function(pg, pi){
      buf.push(openPage());
      headerFooter(buf, d, d._pageNo, d._total, true, false);
      d._pageNo++;
      if (pi === 0){
        acctHead(buf, d, a);
        summarySection(buf, d, a, plan);
        overdraftSection(buf, d, a, plan.sumBottom + C.acct.odGap);
      }
      activityHeader(buf, pg.top);
      renderRows(buf, pg.rows);
      buf.push(BOX(36, pg.top, 576, pg.bottom, C.grayStroke, C.grayStrokeW));
      buf.push(closePage());
    });
  });

  buf.push(openPage());
  page4(buf, d);
  buf.push(closePage());
  var html = assembleVec(buf.join(""));
  StatementEngine._ops = OPSSTORE;
  return html;
}

  fmt:fmt, money:money, planAccount:planAccount, acctStats:acctStats };
})();

    /* 非 WinAnSi 字符（如中文）不在复刻范围：统计并在绘制时以 * 替代；Type0 字体（GID 编码）不受此限 */
    if (!spec.type0){
      for (var chx in chars){ if (winByte(chx) < 0) lastMissing[chx] = (lastMissing[chx]||0)+1; }
    }
    /* 原稿 FontFile2 原始字节流（嵌入子集）：内部字形表/字形ID/度量与原稿完全一致 */
    var bytes = window.FONT_ORIG_B64 && window.FONT_ORIG_B64[spec.fam]
      ? b64ToU8(window.FONT_ORIG_B64[spec.fam])
      : b64ToU8(window.FONT_B64[spec.fam]);
    var fk2 = FK[spec.fam];
    var gidOf = function(ch){ try { return fk2.layout(ch).glyphs[0].id; } catch(e){ return 0; } };
    function buildFont(sync){
      var comp = sync;
      var streamDict = doc.context.obj({Length: comp.length, Length1: bytes.length, Filter:"FlateDecode"});
      var ffRef = doc.context.register(L.PDFRawStream.of(streamDict, comp));
      var dRef = doc.context.register(descDict(spec, ffRef));
      if (spec.type0){
        var wArr = [], seen = {};
        for (var c3 in chars){
          var g3 = gidOf(c3);
          if (seen[g3]) continue; seen[g3] = 1;
          wArr.push(g3); wArr.push([Math.round(E.wOf(c3, spec.fam, 1000))]);
        }
        var cidObj = {Type:"Font", Subtype:"CIDFontType2", BaseFont: spec.base,
          CIDSystemInfo:{Registry: L.PDFString.of("(Adobe)"), Ordering: L.PDFString.of("(Identity)"), Supplement:0},
          CIDToGIDMap: "Identity",
          DW:1000, FontDescriptor: dRef};
        if (wArr.length) cidObj.W = doc.context.obj(wArr);
        var cidRef = doc.context.register(doc.context.obj(cidObj));
        var t0Ref = doc.context.register(doc.context.obj({Type:"Font", Subtype:"Type0", BaseFont: spec.base,
          Encoding:"Identity-H", DescendantFonts:[cidRef]}));
        var tu = "/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n1 begincodespacerange\n<0000> <ffff>\nendcodespacerange\n";
        var n2 = 0, body = "";
        for (var c4 in chars){
          var g4 = gidOf(c4);
          var u4 = c4.codePointAt(0).toString(16);
          while (u4.length < 4) u4 = "0"+u4;
          body += "<"+("000"+g4.toString(16)).slice(-4)+"> <"+u4+">\n";
          n2++;
        }
        if (n2) tu += n2+" beginbfchar\n"+body+"endbfchar\n";
        tu += "endcmap CMapName currentdict /CMap defineresource pop end end";
        var tuBytes = new TextEncoder().encode(tu);
        var tuRef = doc.context.register(L.PDFRawStream.of(doc.context.obj({Length: tuBytes.length}), tuBytes));
        doc.context.lookup(t0Ref).set(L.PDFName.of("ToUnicode"), tuRef);
        F[spec.res] = { duck: makeDuck(spec.res, t0Ref, function(t){
          var hex = "";
          for (var i=0;i<t.length;i++) hex += ("000"+gidOf(t[i]).toString(16)).slice(-4);
          return L.PDFHexString.of(hex);
        }), ref: t0Ref, fam: spec.fam, mode:"type0" };
      } else {
        /* 简单 TrueType：WinAnsiEncoding + FirstChar/LastChar/Widths（与原稿 TT2/TT4/TT6 同构） */
        var codeSet = {};
        for (var c5 in chars){ var b5 = winByte(c5); if (b5 >= 32) codeSet[b5] = 1; }
        var codes = Object.keys(codeSet).map(Number).sort(function(a,b){return a-b;});
        if (!codes.length){ codes = [32]; codeSet[32] = 1; }
        var first = codes[0], last = codes[codes.length-1];
        var widths = [];
        for (var cc = first; cc <= last; cc++){
          /* 与原稿一致：仅实际使用的码位给宽度，其余为 0 */
          widths.push(codeSet[cc] ? Math.round(E.wOf(String.fromCharCode(cc), spec.fam, 1000)) : 0);
        }
        var fRef = doc.context.register(doc.context.obj({Type:"Font", Subtype:"TrueType", BaseFont: spec.base,
          Encoding: "WinAnsiEncoding", FirstChar: first, LastChar: last, Widths: widths, FontDescriptor: dRef}));
        F[spec.res] = { duck: makeDuck(spec.res, fRef, winEncFn), ref: fRef, fam: spec.fam, mode:"simple" };

  });
  await Promise.all(_pendingEmbeds);
  /* 非 WinAnsi 字形缺失的绘制替代 */
  function sanitizeDraw(s){
    var out2 = "";
    for (var i=0;i<s.length;i++) out2 += (winByte(s[i]) >= 0 || s[i]===" ") ? s[i] : "*";
    return out2;
  }
  function fontByFam(fam){
    for (var k in F){ if (F[k].fam === fam) return F[k]; }
    return null;
  }

  /* ---------- 3) 绘制 ---------- */
  function drawSmart(pg, s, fam, x, y, size, rot){
    var key = Object.keys(F).filter(function(k){return F[k].fam===fam;})[0];
    if (!key) return;
    var e = F[key];
    if (e.mode !== "type0") s = sanitizeDraw(s);
    var opts = {x:x, y:y, size:size, font:e.duck, color:rgb(0,0,0)};
    if (rot) opts.rotate = degrees(rot);
    pg.drawText(s, opts);
  }

  function mkPanelImg(w, h){
    var bytes = new Uint8Array(w * h);   /* 全白 */
    var ref = doc.context.register(L.PDFRawStream.of(
      doc.context.obj({Type:"XObject", Subtype:"Image", Width:w, Height:h,
        ColorSpace:"DeviceGray", BitsPerComponent:8, Length: bytes.length}), bytes));
    var im = Object.create(L.PDFImage.prototype);
    im.ref = ref; im.width = w; im.height = h;
    im.size = function(){ return {width:w, height:h}; };
    return im;
  }
  /* 与原稿模板图像同尺寸（514×90 / 514×108） */
  var panelImgA = mkPanelImg(514, 90), panelImgB = mkPanelImg(514, 108);

  var imgCache = {};
  async function imgFor(src){
    if (src === "logo") src = data.bank.logo || E.LOGO_DEFAULT;
    else if (src === "house") src = E._housePng;
    else if (src === "borderL") src = E._borderL;
    else if (src === "borderR") src = E._borderR;
    else if (src === "panelA") return panelImgA;
    else if (src === "panelB") return panelImgB;
    if (!src) return null;
    if (!imgCache[src]){
      var b64 = src.split(",")[1];
      imgCache[src] = await doc.embedPng(b64ToU8(b64));
    }
    return imgCache[src];
  }

  /* 依据原稿内容流顺序重排 op（仅顺序，不改坐标；匹配失败保持自然顺序） */
  function desp(s){ return String(s).replace(/\s+/g, ""); }
  function reorderOps(ops, pageNo){
    var spec = ORDER_SPEC[pageNo];
    if (!spec) return ops;
    /* 元素级精确索引：despaced 文本 -> 出现位置列表（避免子串误配） */
    var elIndex = {};
    spec.forEach(function(t, i2){
      var d = desp(t);
      (elIndex[d] = elIndex[d] || []).push(i2);
    });
    var usedCount = {};
    function anchorOf(t){
      var arr = elIndex[t];
      if (!arr) return null;
      var n = usedCount[t] || 0;
      usedCount[t] = n + 1;
      return n < arr.length ? arr[n] : null;
    }
    /* 合并连续单字符 t op（逐字标题）为游程 */
    var runs = [], cur = null;
    ops.forEach(function(o, idx){
      var isTxt = (o.k === "t" || o.k === "tp" || o.k === "j");
      /* 连续性：下一字符 x 与上一字符 x 的间距 < 15pt（字距+词距）视为同一游程；列间距远大于此 */
      var cont = cur && cur.lastX != null && o.x != null &&
        (o.x - cur.lastX) > -1 && (o.x - cur.lastX) < 15;
      if (cur && cur.singleChar && cont && isTxt && o.k === "t" && o.s.length === 1 &&
          cur.f === o.f && Math.abs(cur.b - o.b) < 0.01 && Math.abs(cur.z - o.z) < 0.01){
        cur.txt += o.s; cur.idx.push(idx); cur.lastX = o.x; cur.lastCh = o.s; return;
      }
      var r = { txt: isTxt ? desp(o.s) : null, idx: [idx], o: o,
                f: o.f, b: o.b, z: o.z,
                singleChar: isTxt && o.k === "t" && o.s.length === 1,
                lastX: o.x, lastCh: o.s };
      runs.push(r);
      cur = r;
    });
    var prevAnchor = 0;
    runs.forEach(function(r){
      if (r.txt === null){ r.anchor = null; return; }
      var a = anchorOf(r.txt);   /* 空文本(空格 span)同样可锚定 */
      r.anchor = (a != null) ? a : prevAnchor + 0.5;
      if (a != null) prevAnchor = r.anchor;
    });
    /* 非文本 op 继承前一个文本锚点 */
    var lastA = 0, seq = 0;
    runs.forEach(function(r){
      if (r.anchor != null) lastA = r.anchor;
      r.sortKey = (r.anchor != null ? r.anchor : lastA + 0.5) * 1000 + (seq++);
    });
    var sorted = runs.slice().sort(function(a,b){ return a.sortKey - b.sortKey; });
    var out = [];
    sorted.forEach(function(r){ r.idx.forEach(function(i){ out.push(ops[i]); }); });
    return out;
  }

  var pageNoCur = 0;
  async function drawPage(pg, ops, pno){
    var pending = [];
    for (var i=0;i<ops.length;i++){
      var o = ops[i];
      if (o.k === "t"){
        drawSmart(pg, o.s, o.f, o.x, 792-o.b, o.z, o.rot);
      } else if (o.k === "tp"){
        var x = o.x;
        for (var ci=0;ci<o.s.length;ci++){
          var ch = o.s[ci];

          var p = parts[pi];

          else { drawSmart(pg, p, o.f, jx, jy, o.z); jx += E.wOf(p, o.f, o.z); }
        }
      } else if (o.k === "r"){
        var c = hexRGB(o.st);
        var fc = o.fl ? [1,1,1] : null;
        pg.drawSvgPath(rrectPath(o.x2-o.x1, o.y2-o.y1, o.rx),
          { x:o.x1, y:792-o.y1,
            borderColor: rgb(c[0],c[1],c[2]), borderWidth: o.w,
            ...(fc ? {fillColor: rgb(fc[0],fc[1],fc[2])} : {}) });
      } else if (o.k === "f"){
        var fc2 = hexRGB(o.st) || [1,1,1];
        pg.drawRectangle({x:o.x1, y:792-o.y2, width:o.x2-o.x1, height:o.y2-o.y1,
          color: rgb(fc2[0],fc2[1],fc2[2])});
      } else if (o.k === "l"){
        /* 原稿细线为细高填充矩形 */
        var lc = hexRGB(o.st) || [0,0,0];
        var horiz = Math.abs(o.y2 - o.y1) <= Math.abs(o.x2 - o.x1);
        var h2 = o.w;
        if (horiz){
          pg.drawRectangle({x: Math.min(o.x1,o.x2), y: 792 - Math.max(o.y1,o.y2) - h2/2,
            width: Math.abs(o.x2-o.x1), height: h2, color: rgb(lc[0],lc[1],lc[2])});
        } else {
          pg.drawRectangle({x: Math.min(o.x1,o.x2) - h2/2, y: 792 - Math.max(o.y1,o.y2),
            width: h2, height: Math.abs(o.y2-o.y1), color: rgb(lc[0],lc[1],lc[2])});

      } else if (o.k === "i"){
        pending.push((async function(o){
          var img = await imgFor(o.src);
          if (img) pg.drawImage(img, {x:o.x, y:792-o.y-o.h, width:o.w, height:o.h});

    var z = 34, asc = E.ascOf(E.F.HB, z), ls = 10, ang = 32*Math.PI/180;

    var pg = doc.addPage([612, 792]);
    (SPACE_SPEC[String(p+1)] || []).forEach(function(s2){
      opsPages[p].push({k:"t", x:s2.x, b:s2.b, s:s2.t, f:s2.f, w:400, z:s2.z});

  await doc.flush();
  /* 内容流 Tf 字体名规范化：去掉 pdf-lib uniqueKey 产生的哈希后缀（/F10-1932657749 → /F10） */
  doc.context.enumerateIndirectObjects().forEach(function(pair){
    var obj = pair[1];
    if (!obj || !obj.operators) return;
    obj.operators.forEach(function(op){
      try{
        if (String(op.name) === "Tf" && op.args && op.args[0]){
          var v = op.args[0].toString().replace(/^\//, "");
          var m = /^(F\d+|TT\d)-\d+$/.exec(v);
          if (m) op.args[0] = L.PDFName.of(m[1]);
        }
      }catch(e){}
    });
  });
  /* 每页资源字典：仅保留原稿的七个资源名 */
  doc.getPages().forEach(function(pg){
    var res = pg.node.Resources();
    var fonts = res.lookup(L.PDFName.of("Font"), L.PDFDict);
    if (!fonts){ fonts = doc.context.obj({}); res.set(L.PDFName.of("Font"), fonts); }
    fonts.keys().forEach(function(k){ fonts.delete(k); });
    SPECS.forEach(function(spec){ fonts.set(L.PDFName.of(spec.res), F[spec.res].ref); });
  });

  /* ---------- 5) 元数据（默认与原稿逐字一致，含非标准日期字面量） ---------- */
  var M = data.pdfMeta || PDF_META;
  var info = new L.PDFDict(new Map(), doc.context);
  function setInfo(key, val){
    if (val != null && String(val).length > 0) info.set(L.PDFName.of(key), L.PDFString.of(String(val)));
  }
  setInfo("Title", M.title); setInfo("Author", M.author); setInfo("Creator", M.creator);
  setInfo("Producer", M.producer); setInfo("Subject", M.subject); setInfo("Keywords", M.keywords);
  setInfo("CreationDate", String(M.creationDate || "").trim()
          || (window.__allyDefCd ? window.__allyDefCd(data.meta.statementDate) : ""));
  setInfo("ModDate", M.modDate);
  doc.context.trailerInfo.Info = info;
  return await doc.save();
}

window.PdfBuilder = { build: buildStatementPdf, META: PDF_META,
  getMissing: function(){ return lastMissing; } };
})();
</script>

   格式与原稿非标准字面量一致（如 6/24/2026 05:36:28），不写时区。
   默认算好填进字段（肉眼可见、导出不再变）；仅当值为空或仍属自动值
   (_cdAuto) 时重算，手工改过即冻结尊重用户值 */
function applyAutoCreation(){
  if (!data.pdfMeta) data.pdfMeta = JSON.parse(JSON.stringify(DEFAULT_DATA.pdfMeta));
  if (data.pdfMeta._cdAuto === false) return;
  data.pdfMeta._cdAuto = true;
  data.pdfMeta.creationDate = defaultCreationDate(data.meta.statementDate);
  if (window.__cdEl && window.__cdEl.value !== data.pdfMeta.creationDate)
    window.__cdEl.value = data.pdfMeta.creationDate;
}
function defaultCreationDate(sd){
  var m = String(sd || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return "";
  var d = new Date(Date.UTC(+m[3], +m[1] - 1, +m[2]) + 86400000);   // 次日
  var p = function(n){ return String(n).padStart(2, "0"); };
  return (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "/" + d.getUTCFullYear()
       + " " + p(5 + Math.floor(Math.random() * 2))
       + ":" + p(Math.floor(Math.random() * 60))
       + ":" + p(Math.floor(Math.random() * 60));
}

var pdfTimer = null, pdfUrl = null, pdfBuilding = false, pdfDirty = false;
function pdfModeOn(){ return document.getElementById("chkPdfPreview").checked; }
function schedulePdf(){
  if (!pdfModeOn()) { pdfDirty = true; return; }   /* HTML 预览模式：不自动生成，导出时现生成 */
  clearTimeout(pdfTimer);
  pdfDirty = true;
  document.getElementById("pdfStatus").textContent = "输入中，停顿后自动更新…";
  pdfTimer = setTimeout(function(){ buildPdfPreview(); }, 1200);
}
function bytesToB64(bytes){
  var arr = new Uint8Array(bytes), s = "";
  var CH = 32768;
  for (var i=0;i<arr.length;i+=CH) s += String.fromCharCode.apply(null, arr.subarray(i, i+CH));
  return btoa(s);
}
async function buildPdfPreview(force){
  if (pdfBuilding) { clearTimeout(pdfTimer); pdfTimer = setTimeout(function(){ buildPdfPreview(force); }, 300); return; }
  if (!force && !pdfDirty && pdfUrl) return;
  pdfBuilding = true;
  pdfDirty = false;
  try{
    var bytes = await PdfBuilder.build(data);
    var blob = new Blob([bytes], {type:"application/pdf"});
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    var frame = document.getElementById("pdfFrame");
    if (location.protocol === "file:"){
      /* file:// 下部分环境的 PDF 查看器不接受 blob:null，改用 data: URL */
      window.__pdfSrc = "data:application/pdf;base64," + bytesToB64(bytes);
    } else {
      pdfUrl = URL.createObjectURL(blob);
      window.__pdfSrc = pdfUrl;
    }
    frame.src = window.__pdfSrc;
    var miss = PdfBuilder.getMissing();
    var mkeys = Object.keys(miss);
    document.getElementById("pdfStatus").textContent =
      "PDF 已更新 · " + (Math.ceil(blob.size/1024)) + " KB · " + (window.StatementEngine._ops||[]).length + " 页" +
      (mkeys.length ? " · 字体缺字形: " + mkeys.slice(0,8).join(" ") : "");
  }catch(e){
    document.getElementById("pdfStatus").textContent = "PDF 生成失败：" + e;
  }
  pdfBuilding = false;
}
function makeWatermark(){
  var wm = document.createElement("div"); wm.className = "wm";
  for (var r=0;r<6;r++) for (var c=0;c<3;c++){
    var s = document.createElement("span");
    s.textContent = "SAMPLE";
    s.style.left = (-80 + c*170 + (r%2?85:0)) + "pt";
    s.style.top = (40 + r*135) + "pt";
    wm.appendChild(s);
  }
  return wm;
}
function applyZoom(){
  var avail = document.getElementById("preview").clientWidth - 24;
  var w = 612*4/3; /* 612pt = 816px */
  var z = zoomMode==="fit" ? Math.max(0.3, Math.min(2, avail/w)) : Number(zoomMode);
  wrapEl.style.zoom = z;
  var frame = document.getElementById("pdfFrame");
  if (zoomMode === "fit"){
    frame.style.width = "100%"; frame.style.margin = "0";
  } else {
    var fw = Math.round(w*z);
    frame.style.width = fw+"px"; frame.style.margin = "0 auto"; frame.style.display = "inline-block";
  }
  if (document.body.classList.contains("pdfmode")) frame.style.display = "block";
}

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  for (var k in attrs||{}){ if (k==="text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  (kids||[]).forEach(function(c){ e.appendChild(c); });
  return e;
}
function row(lbl, input){

function inp(get,set,type){
  var i = el("input",{type:type||"text"});
  i.value = get();
  i.addEventListener("input", function(){ set(type==="number"? Number(i.value)||0 : i.value); renderSoon(); });
  return i;
}
function area(get,set,rows){
  var a = el("textarea",{rows:rows||3});
  a.value = get();
  a.addEventListener("input", function(){ set(a.value); renderSoon(); });
  return a;
}
function sel(get,set,opts){
  var s = el("select");
  opts.forEach(function(o){
    var op = el("option",{value:o[0],text:o[1]});
    if (String(get())===String(o[0])) op.selected = true;
    s.appendChild(op);

  s.addEventListener("change", function(){ set(s.value); refresh(); });
  return s;
}

      f6.appendChild(el("div",{class:"hint",text:"段落 "+(bi+1)+"（已静态化·编辑不影响输出）"}));
      f6.appendChild(area(function(){return bk.text;}, function(v){bk.text=v;}, 3));
    }
  });
  p.appendChild(f6);
}

/* ---------------- 工具栏 ---------------- */
document.getElementById("chkWM").addEventListener("change", function(e){ data.watermark = e.target.checked; refresh(); });
document.getElementById("panel").addEventListener("keydown", function(e){
  if (e.key === "Enter" && pdfModeOn()){ clearTimeout(pdfTimer); buildPdfPreview(); }
});
document.getElementById("panel").addEventListener("focusout", function(){
  if (pdfModeOn() && pdfDirty){ clearTimeout(pdfTimer); buildPdfPreview(); }
});
document.getElementById("chkPdfPreview").addEventListener("change", function(e){
  document.body.classList.toggle("pdfmode", e.target.checked);
  applyZoom();
  if (e.target.checked){ document.getElementById("pdfStatus").textContent = "PDF 生成中…"; buildPdfPreview(true); }
});
document.getElementById("btnOpenPdf").addEventListener("click", async function(){
  var btn = this; btn.disabled = true; btn.textContent = "生成中…";
  try{
    if (!window.__pdfSrc || pdfDirty) await buildPdfPreview(true);
    if (window.__pdfSrc) window.open(window.__pdfSrc, "_blank");
  }catch(e){ alert("PDF 生成失败：" + e); }
  btn.disabled = false; btn.textContent = "在新标签打开 PDF";
});
var pdfNameInput = document.getElementById("pdfNameInput");
pdfNameInput.value = data.exportFileName || "Statement";
pdfNameInput.addEventListener("input", function(){
  data.exportFileName = pdfNameInput.value;
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 300);
});
function exportPdfName(){
  var n = String(data.exportFileName || "Statement").trim() || "Statement";
  n = n.replace(/[\\/:*?"<>|]/g, "_");
  if (!/\.pdf$/i.test(n)) n += ".pdf";
  return n;
}
window.__exportPdfName = exportPdfName;
document.getElementById("btnExportPdf").addEventListener("click", async function(){
  var btn = this;
  btn.textContent = "生成中…"; btn.disabled = true;
  try{
    var bytes = await PdfBuilder.build(data);
    var blob = new Blob([bytes], {type:"application/pdf"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = exportPdfName();
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }catch(e){ alert("PDF 生成失败：" + e); }
  var miss = PdfBuilder.getMissing();
  var keys = Object.keys(miss);
  if (keys.length){
    alert("注意：以下字符在模板字体中无对应字形，PDF 中已用 □ 或省略替代：\n" + keys.join("  ") +
      "\n（HTML 预览可用系统中文字体显示，但导出的 PDF 使用原稿同款字体）");
  }
  btn.textContent = "导出 PDF（代码直出）"; btn.disabled = false;
});
document.getElementById("zoomSel").addEventListener("change", function(e){ zoomMode = e.target.value; applyZoom(); });
window.addEventListener("resize", applyZoom);
document.getElementById("btnPrint").addEventListener("click", function(){ window.print(); });
document.getElementById("btnReset").addEventListener("click", function(){
  if (confirm("恢复为默认样例数据？当前修改将丢失。")){
    localStorage.removeItem("stmt-data-v1");
    localStorage.removeItem("stmt-data-v2");
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    applyAutoCreation();
    document.getElementById("chkWM").checked = data.watermark;
    refresh();
  }
});
document.getElementById("btnExportJSON").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(data,null,1)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "statement-data.json"; a.click();
});
document.getElementById("btnImportJSON").addEventListener("click", function(){ document.getElementById("fileImport").click(); });
document.getElementById("fileImport").addEventListener("change", function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try { data = JSON.parse(r.result); refresh(); }
    catch(err){ alert("JSON 解析失败"); }
  };
  r.readAsText(f); e.target.value = "";
});
document.getElementById("btnExportHTML").addEventListener("click", function(){
  var engine = document.getElementById("engine").textContent;
  var css = Array.prototype.map.call(document.querySelectorAll("style"), function(s){ return s.textContent; }).join("\n");
  var boot = "var DATA = "+JSON.stringify(data)+";\n"+
    "document.addEventListener('DOMContentLoaded', function(){\n"+
    "  document.title='Statement';\n"+
    "  var html = StatementEngine.renderPages(DATA);\n"+
    "  var pages=document.createElement('div'); pages.id='pages';\n"+
    "  var wrap=document.createElement('div'); wrap.className='scale-wrap'; wrap.innerHTML=html;\n"+
    "  pages.appendChild(wrap); document.body.appendChild(pages);\n"+
    "  if (DATA.watermark){ wrap.querySelectorAll('.page').forEach(function(p){\n"+
    "    var wm=document.createElement('div'); wm.className='wm';\n"+
    "    for(var r=0;r<6;r++) for(var c=0;c<3;c++){ var s=document.createElement('span'); s.textContent='SAMPLE';\n"+
    "      s.style.left=(-80+c*170+(r%2?85:0))+'pt'; s.style.top=(40+r*135)+'pt'; wm.appendChild(s); }\n"+
    "    p.appendChild(wm); }); }\n"+
    "});";
  var html = "<!DOCTYPE html>\n<html lang='en'><head><meta charset='utf-8'><title>Statement</title>\n<style>\n"+css+
    "\nbody{background:#565a61}\n#pages{padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:26px}\n</style>\n</head>\n<body>\n"+
    "<scr"+"ipt>"+engine+"</scr"+"ipt>\n<scr"+"ipt>"+boot+"</scr"+"ipt>\n</body></html>";
  var blob = new Blob([html], {type:"text/html"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "statement.html"; a.click();
});

/* ---------------- 启动（先加载字体再度量排版） ---------------- */
function boot(){
  var fonts = ["10px Helvetica","bold 10px Helvetica","10px Times-Roman","10px ArialMT",
               "10px Arial-BoldMT","10px SymbolMT","12px Arial-BoldMT"];
  Promise.all(fonts.map(function(f){ return document.fonts.load(f).catch(function(){}); }))
    .then(function(){ return document.fonts.ready; })
    .then(function(){ render(); buildPanel(); })
    .catch(function(){ render(); buildPanel(); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
