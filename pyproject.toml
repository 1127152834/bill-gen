[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billgen"
version = "2.0.0.dev0"
description = "合成对账单 / 账单版式生成器（13 个模板，编辑器 + PDF 引擎）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyMuPDF==1.26.6",
    "fonttools>=4.68",
    "uharfbuzz>=0.57",
    "pillow>=13.0",
    "pystrich==0.20",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
]

[project.scripts]
billgen = "billgen.cli:main"

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__", "**/*.pyc", "**/*.bak", "**/pv_png", "**/preview*.pdf", "**/preview*.png", "**/data*.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/billgen"]

[tool.hatch.build.targets.wheel.force-include]
"runtime_paths.py" = "runtime_paths.py"
"examples" = "billgen/examples"
"scripts/private-assets.json" = "billgen/resources/private-assets.json"
"examples/wf.json" = "billgen/themes/wellsfargo/data_sample.json"

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "examples", "tests", "tools", "docs", "runtime_paths.py", "README.md", "pyproject.toml", "constraints-ci.txt", "Makefile", "Dockerfile", ".dockerignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/billgen/themes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# 遗留代码（P0 之前的单测与资产脚本）保留极限单行风格，P5 统一整顿时再放开。
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E701", "E702", "E402", "SIM117"]
"tests/test_*.py" = ["E701", "E702"]
"runtime_paths.py" = ["UP009"]
"run.py" = ["SIM105"]
"tests/test_examples.py" = ["SIM117"]
# 服务端遗留编排代码（P3 重写），先放行风格类告警
"src/billgen/server/**/*.py" = ["E402", "E731", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/billgen/spec.py",
    "src/billgen/registry.py",
    "src/billgen/paths.py",
    "src/billgen/synth",
    "src/billgen/server/application.py",
    "src/billgen/server/http.py",
]
ignore_missing_imports = true
