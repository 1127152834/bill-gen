services:
  billgen:
    image: billgen:full
    build: .
    ports:
      # 单一入口：工作台 + 渲染 API 都在 8800
      - "127.0.0.1:${HUB_PORT:-8800}:8800"
    environment:
      BILL_GEN_DATA_DIR: /data/billgen
      BILLGEN_OUT: /data/renders
      # 账单 JSON 生成器（Python 版）：档案库、任务目录、模型配置都在挂载盘上
      BILLGEN_PROFILES: /data/billgen/profiles.json
      BILLGEN_JOBS_DIR: /data/jobs
      BILLGEN_JOB_WORKERS: ${BILLGEN_JOB_WORKERS:-2}
      BILLGEN_LLM_CONFIG: /data/billgen/llm.json
      # 真实模型 / 检索凭据（生成引擎直接读这四个）
      BILLGEN_LLM_BASE_URL: ${BILLGEN_LLM_BASE_URL:-}
      BILLGEN_LLM_API_KEY: ${BILLGEN_LLM_API_KEY:-}
      BILLGEN_LLM_MODEL: ${BILLGEN_LLM_MODEL:-gpt-6.1-sol}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    init: true
    volumes:
      # 绑定挂载而不是命名卷：配置就是仓库旁边的 ./.data/billgen/，
      # 看得见、能备份、`docker compose down -v` 或清理未使用卷也带不走它。
      - ./.data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8800/healthz >/dev/null"]
      interval: 15s
      timeout: 6s
      start_period: 25s
      retries: 3
